<script src="./canzhai-trend/_shared/js/echarts.min.js"></script>
<script>
var _chartInstances = {};

function formatMoney(v) {
  if (v == null || isNaN(v)) return '—';
  return v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

async function initCharts() {
  var style = getComputedStyle(document.documentElement);
  var accent = style.getPropertyValue('--accent').trim();
  var accent2 = style.getPropertyValue('--accent2').trim();
  var series3 = style.getPropertyValue('--series3').trim();
  var ink = style.getPropertyValue('--ink').trim();
  var muted = style.getPropertyValue('--muted').trim();
  var rule = style.getPropertyValue('--rule').trim();
  var bg2 = style.getPropertyValue('--bg2').trim();
  var bg = style.getPropertyValue('--bg').trim();

  var resp = await fetch('../stocks/dfcf_rzrq.json');
  var raw = await resp.json();
  raw.sort(function (a, b) {
    return (a.DIM_DATE || '').localeCompare(b.DIM_DATE || '');
  });

  var dates = raw.map(function (r) { return (r.DIM_DATE || '').slice(0, 10); });
  // 原始金额为元，换算为亿元
  var rzrq = raw.map(function (r) { return r.RZRQYE != null ? r.RZRQYE / 1e8 : null; });
  var rz = raw.map(function (r) { return r.RZYE != null ? r.RZYE / 1e8 : null; });
  var rq = raw.map(function (r) { return r.RQYE != null ? r.RQYE / 1e8 : null; });

  var footerInfo = document.querySelector('footer .sources ol li:first-child .src-title');
  if (footerInfo && dates.length > 0) {
    footerInfo.textContent = '东方财富 RPTA_RZRQ_LSHJ 融资融券历史数据，' + dates[0] + ' 至 ' + dates[dates.length - 1] + ' 共 ' + dates.length + ' 个交易日。';
  }

  function latest(arr) {
    for (var i = arr.length - 1; i >= 0; i--) {
      if (arr[i] != null) return arr[i];
    }
    return null;
  }
  function minMax(arr) {
    var mn = Infinity, mx = -Infinity;
    arr.forEach(function (v) { if (v != null) { if (v < mn) mn = v; if (v > mx) mx = v; } });
    return [mn === Infinity ? 0 : mn, mx === -Infinity ? 0 : mx];
  }

  function fillKpi(id, idR, val, mmv) {
    document.getElementById(id).textContent = val != null ? formatMoney(val) + '亿' : '—';
    document.getElementById(idR).textContent = '区间 ' + formatMoney(mmv[0]) + ' – ' + formatMoney(mmv[1]) + ' 亿';
  }
  fillKpi('kpi-rzrq', 'kpi-rzrq-r', latest(rzrq), minMax(rzrq));
  fillKpi('kpi-rz', 'kpi-rz-r', latest(rz), minMax(rz));
  fillKpi('kpi-rq', 'kpi-rq-r', latest(rq), minMax(rq));

  function baseTooltip() {
    return {
      trigger: 'axis',
      appendToBody: true,
      backgroundColor: bg2,
      borderColor: rule,
      textStyle: { color: ink },
      valueFormatter: function (v) { return v != null ? formatMoney(v) + ' 亿' : '—'; }
    };
  }
  function axisStyle(val) {
    return { axisLine: { lineStyle: { color: rule } }, axisLabel: { color: muted, fontSize: 11 }, splitLine: { lineStyle: { color: rule } } };
  }

  function buildGrad(color) {
    return {
      type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
      colorStops: [{ offset: 0, color: color + '2e' }, { offset: 1, color: color + '00' }]
    };
  }

  function buildChart(id, color, values, yName) {
    if (_chartInstances[id]) {
      _chartInstances[id].dispose();
    }

    var data = dates.map(function (d, i) { return [d, values[i]]; });
    var chart = echarts.init(document.getElementById(id), null, { renderer: 'svg' });
    _chartInstances[id] = chart;
    chart.setOption({
      animation: false,
      color: [color],
      tooltip: Object.assign(baseTooltip(), {
        formatter: function (ps) {
          var p = ps[0];
          return p.axisValue + '<br/><b>' + yName + '</b>：' + (p.value[1] != null ? formatMoney(p.value[1]) : '—') + ' 亿元';
        }
      }),
      grid: { left: 14, right: 20, top: 14, bottom: 74, containLabel: true },
      xAxis: Object.assign(axisStyle(false), { type: 'category', boundaryGap: false, data: dates, axisLabel: { color: muted, fontSize: 11, interval: 'auto' } }),
      yAxis: Object.assign(axisStyle(true), { type: 'value', name: yName + '（亿元）', nameTextStyle: { color: muted, fontSize: 11 }, scale: true }),
      dataZoom: [
        { type: 'inside', start: 0, end: 100 },
        { type: 'slider', start: 0, end: 100, height: 22, bottom: 16, borderColor: rule, fillerColor: color + '22', textStyle: { color: muted } }
      ],
      series: [{
        type: 'line',
        data: data,
        showSymbol: false,
        smooth: false,
        lineStyle: { width: 2, color: color },
        areaStyle: { color: buildGrad(color) },
        markPoint: {
          symbol: 'pin', symbolSize: 42, label: { fontSize: 10, color: bg },
          data: [
            { type: 'max', name: '最高' },
            { type: 'min', name: '最低' }
          ],
          itemStyle: { color: color }
        }
      }]
    });
    window.addEventListener('resize', function () { chart.resize(); });
  }

  buildChart('chart-rzrq', accent2, rzrq, '融资融券余额');
  buildChart('chart-rz', accent, rz, '融资余额');
  buildChart('chart-rq', series3, rq, '融券余额');
}

document.addEventListener('DOMContentLoaded', function () { initCharts(); });
</script>
